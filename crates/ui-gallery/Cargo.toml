[package]
name = "ui-gallery"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "document"] }
ui = { path = "../ui" }
futures-timer = { version = "3", features = ["wasm-bindgen"] }

# dioxus-web 0.7.10 reads the location without enabling it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["EventTarget", "Window", "Location"] }
wasm-bindgen = "0.2"

[dev-dependencies]
base64 = "0.23"
serde_json = "1"

[features]
default = []
web = ["dioxus/web", "dioxus/launch"]
