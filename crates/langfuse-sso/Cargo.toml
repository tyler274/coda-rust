[package]
name = "langfuse-sso"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "langfuse-sso"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.23"
http = { path = "../http", package = "coda-http", features = ["iap"] }
jsonwebtoken = { version = "9", default-features = false }
percent-encoding = "2"
ring = { version = "0.17", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
url = "2"

[dev-dependencies]
http = { path = "../http", package = "coda-http", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json"] }
telemetry = { path = "../telemetry", features = ["testing"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
tower = { version = "0.5", features = ["util"] }
