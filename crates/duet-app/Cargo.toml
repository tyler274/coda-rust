[package]
name = "duet-app"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
duet-client = { path = "../duet-client" }
duet-health = { path = "../duet-health" }
duet-notify = { path = "../duet-notify" }
duet-page = { path = "../duet-page" }
duet_wire = { path = "../duet-wire" }
futures-timer = "3"
iana-time-zone = "0.1"
ui = { path = "../ui" }
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "Storage", "Location", "Document", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Node", "Element"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
web = ["dioxus/web", "dioxus/launch"]
mobile = ["dioxus/mobile", "dioxus/launch"]
desktop = ["dioxus/desktop", "dioxus/launch"]
