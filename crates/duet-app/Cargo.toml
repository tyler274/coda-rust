[package]
name = "duet-app"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
duet-client = { path = "../duet-client" }
duet-health = { path = "../duet-health" }
duet-notify = { path = "../duet-notify" }
duet_wire = { path = "../duet-wire" }
futures-timer = "3"
iana-time-zone = "0.1"
ui = { path = "../ui" }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
mobile = ["dioxus/mobile", "dioxus/launch"]
desktop = ["dioxus/desktop", "dioxus/launch"]
