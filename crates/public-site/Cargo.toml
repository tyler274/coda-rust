[package]
name = "public-site"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "public-site"
path = "src/bin/public-site.rs"

[dependencies]
axum = "0.8"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "router"] }
dioxus-history = "0.7.10"
dioxus-router = "0.7.10"
dioxus-ssr = "0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
brotli = "8"
flate2 = "1"
sha2 = "0.10"
subtle = "2"
mime_guess = "2"
jsonwebtoken = { version = "9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http = { version = "0.6", features = ["limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
base64 = "0.23"
