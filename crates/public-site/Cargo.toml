[package]
name = "public-site"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "public-site"
path = "src/bin/public-site.rs"

[dependencies]
axum = "0.8"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "router"] }
dioxus-history = "0.7.10"
dioxus-router = "0.7.10"
dioxus-ssr = "0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
brotli = "9"
flate2 = "1"
sha2 = "0.11"
subtle = "2"
mime_guess = "2"
http = { path = "../http", package = "coda-http", features = ["iap", "ingress"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tower-http = { version = "0.7", features = ["limit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }

[dev-dependencies]
http = { path = "../http", package = "coda-http", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
