<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <title>Sign in to Coda</title>
  </head>
  <body style="margin:0;padding:0;background:#f8f7f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f7f4;">
      <tr><td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
          <tr><td align="center" style="padding:0 4px 24px;">
            <img src="https://coda.dabney.moe/brand/coda-health-logo-transparent.png" width="120" height="24" alt="Coda Health" style="display:block;margin:0 auto;border:0;width:120px;height:24px;">
          </td></tr>
          <tr><td align="center" style="padding:32px;border:1px solid #e4e6e1;border-radius:20px;background:#ffffff;text-align:center;">
            <h1 style="margin:0 0 24px;color:#17211b;font-size:22px;line-height:28px;font-weight:600;">Sign in to Coda</h1>
            <table role="presentation" align="center" cellpadding="0" cellspacing="0" style="margin:0 auto;"><tr>
              <td style="border-radius:999px;background:#126c5a;mso-padding-alt:12px 24px;">
                <a href="{{link}}" style="display:inline-block;padding:12px 24px;border-radius:999px;color:#ffffff;font-size:14px;line-height:20px;font-weight:600;text-decoration:none;">Sign in</a>
              </td>
            </tr></table>
            <p style="margin:24px 0 0;color:#5e6963;font-size:13px;line-height:20px;">{{detail}}</p>
          </td></tr>
          <tr><td align="center" style="padding:16px 4px 0;color:#5e6963;font-size:13px;line-height:20px;text-align:center;">
            If you didn't request this, you can ignore this email.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
