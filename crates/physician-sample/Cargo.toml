[package]
name = "physician-sample"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
axum = "0.8"
front-door = { path = "../front-door" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
local-product = { path = "../local-product" }
patient-work = { path = "../patient-work" }
physician-auth = { path = "../physician-auth" }
physician-wire = { path = "../physician-wire" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
physician-auth = { path = "../physician-auth" }
front-door = { path = "../front-door" }
sea-orm = { version = "2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
