[package]
name = "physician-sample"
default-run = "physician-sample"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
sea-orm = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sha2 = "0.11"
axum = "0.8"
# Pub/Sub push `message.data` is standard base64, decoded with the Engine API.
base64 = "0.23"
front-door = { path = "../front-door" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gmail = { path = "../gmail" }
# The rehearsal sign-in verifies physician's own IAP assertion.
http = { path = "../http", package = "coda-http", features = ["iap"] }
local-product = { path = "../local-product" }
harness = { path = "../harness" }
patient-work = { path = "../patient-work" }
physician-auth = { path = "../physician-auth" }
physician-bus = { path = "../physician-bus" }
physician-wire = { path = "../physician-wire" }
# Loopback-emulator checks and the official publisher, shared with gmail intake.
pubsub = { path = "../pubsub", features = ["publisher"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
google-cloud-pubsub = "1"
# Official Google auth: anonymous emulator credentials and the Pub/Sub push
# OIDC verifier (Google JWKS, audience and signer email checks).
google-cloud-auth = { version = "1", features = ["idtoken"] }

[dev-dependencies]
base64 = "0.23"
# Signed synthetic OIDC tokens exercise Google's verifier, not a mock verdict.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
mailparse = "0.18"
gmail = { path = "../gmail", features = ["test-util"] }
# Fixture-signed IAP assertions for the rehearsal sign-in tests.
http = { path = "../http", package = "coda-http", features = ["test-util"] }
# The disposable emulator behind tests/scale.
pubsub = { path = "../pubsub", features = ["test-util"] }
public-site = { path = "../public-site" }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "testing"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["registry"] }
physician-auth = { path = "../physician-auth" }
front-door = { path = "../front-door" }
sea-orm = { version = "2", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "with-uuid",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
