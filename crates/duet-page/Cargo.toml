[package]
name = "duet-page"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
cosmic-text = { version = "0.19.0", default-features = false, features = ["std"] }
krilla = { version = "0.8.2", default-features = false }
ttf-parser = "0.25.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
oxifont-bundled = { version = "0.2.2", features = ["bundled-noto"] }

[dev-dependencies]
resvg = { version = "0.50", default-features = false }
