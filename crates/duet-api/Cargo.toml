[package]
name = "duet-api"
default-run = "duet-api"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
duet-page = { path = "../duet-page" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
duet_wire = { path = "../duet-wire" }
front-door = { path = "../front-door" }
harness = { path = "../harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
telemetry = { path = "../telemetry" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
duet-client = { path = "../duet-client" }
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
