[package]
name = "duet-api"
default-run = "duet-api"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
duet-page = { path = "../duet-page" }
duet_wire = { path = "../duet-wire" }
front-door = { path = "../front-door" }
harness = { path = "../harness" }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
npi-registry = { path = "../npi-registry" }
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-json", "with-chrono"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls", "derive"] }
telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal", "time", "sync", "io-util"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
duet-client = { path = "../duet-client" }
chrono = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
