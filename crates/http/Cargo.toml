[package]
name = "coda-http"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Server-side Google IAP signed-header verification. Off by default so the
# browser clients that share this crate never compile it.
iap = ["dep:jsonwebtoken", "dep:tokio"]
# Public fixture key and signer for other crates' tests; `[dev-dependencies]` only.
test-util = ["iap", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = { version = "0.23", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[dev-dependencies]
# Unit tests exercise the IAP verifier and its fixtures.
coda-http = { path = ".", features = ["test-util"] }
axum = "0.8"
base64 = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
