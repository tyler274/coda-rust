[package]
name = "spruce"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "Read-only Spruce conversation sync"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt"] }

[dependencies.axum]
version = "0.8"
optional = true

[features]
# Loopback Spruce API for another crate's tests. Not a live Spruce connection.
test-util = ["dep:axum"]

[dev-dependencies]
# Enables the loopback Spruce API for this crate's own tests.
spruce = { path = ".", features = ["test-util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
