[package]
name = "physician-app"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
physician-client = { path = "../physician-client" }
physician-wire = { path = "../physician-wire" }
serde_json = "1"
ui = { path = "../ui" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[features]
default = []
web = ["dioxus/web", "dioxus/launch"]
desktop = ["dioxus/desktop", "dioxus/launch"]
mobile = ["dioxus/mobile", "dioxus/launch"]
