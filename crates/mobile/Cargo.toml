[package]
name = "mobile"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
duet-app = { path = "../duet-app" }
physician-app = { path = "../physician-app" }
ui = { path = "../ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"] }

[dev-dependencies]
base64 = "0.22"
sea-orm = { version = "2", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
futures-util = "0.3"
async-trait = "0.1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
duet-api = { path = "../duet-api" }
duet-client = { path = "../duet-client" }
duet_wire = { path = "../duet-wire" }
duet-stub = { path = "../duet-stub" }
front-door = { path = "../front-door" }

[features]
default = []
web = ["dioxus/web", "dioxus/launch"]
mobile = ["dioxus/mobile", "dioxus/launch", "duet-app/mobile", "physician-app/mobile"]
