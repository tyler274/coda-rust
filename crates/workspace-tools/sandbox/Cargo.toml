[package]
name = "coda-sandbox"
description = "Set up, check and run the Coda agent sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coda-sandbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
json5 = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
thiserror = "2"
toml = "1"

[lints]
workspace = true
