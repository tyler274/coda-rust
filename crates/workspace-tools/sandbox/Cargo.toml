[package]
name = "coda-sandbox"
description = "Set up, check and run the Coda agent sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "coda-sandbox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
json5 = "1"
rustix = { version = "1", features = ["fs", "net", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true
