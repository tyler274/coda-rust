# Cyrene's sandbox: the file services.coda-sandbox (nix/default.nix) writes to
# /etc/coda-sandbox/config.toml with Cyrene's values. The crate's tests parse
# it; on a host without the module, pass `--config crates/workspace-tools/sandbox/config/cyrene.toml`.
#
# Every path names the same directory on the host and inside the container.

version = 1

[container]
name = "coda-agent"
unit = "container@coda-agent.service"
ssh_host = "coda-agent"
agent_uid = 656360
repo = "/agents/coda/src/coda-rust"

[build]
# A ZFS dataset on the `agents` pool; reflinks need zfs_bclone_enabled = 1.
root = "/agents/coda/build"
keep_seeds = 2

[ci]
# Holds requests/ and results/.
spool = "/agents/coda/ci/spool"
timeout_seconds = 14400
timer = "coda-ci.timer"
service = "coda-ci.service"

[broker]
# The token broker's socket, bound into the container at the same path.
socket = "/run/coda-sandbox/agent/broker.sock"
# Whether `gh auth token` may stand in for a github-agent token the keyring
# does not hold. It reaches every repository you can, so it stays off.
gh_fallback = "off"

[broker.ci]
# Where the CI controller, running as `user`, asks for its github-ci token.
# Host only: the container has no such path.
socket = "/run/coda-sandbox/ci/broker.sock"
user = "coda-ci"

[model_proxy]
# Where Claude Code and Codex in the container send their requests, with the
# broker's model-proxy key; ungate on the host keeps the account sign-ins.
url = "http://10.233.1.1:47821"

[carry]
repo = "/home/luluco/code/coda/coda-rust"
out = "/var/lib/coda-carry"
