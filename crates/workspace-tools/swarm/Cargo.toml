[package]
name = "coda-swarm"
description = "Shared swarm board, roster and channel model with a locked file store."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-general-category = "1"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
