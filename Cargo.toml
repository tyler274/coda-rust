[workspace]
resolver = "2"
members = ["crates/*", "crates/workspace-tools/sandbox", "crates/workspace-tools/swarm"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "0.1.0"

# Lint rules for every crate except the generated duet-wire. A rule belongs here
# when it catches a mistake precisely and the right alternative is clear.
[workspace.lints.clippy]
# Errors keep their cause: `map_err(|_| …)` replaces the original error instead of
# keeping it as the source. Code still converting allows it at its crate root, or
# atop a module that test crates also include, with that reason.
map_err_ignore = "warn"
# Failure looks like failure: `result.ok();` hides a discarded error. Where the
# failure truly matters to no one, `let _ = result;` discards it visibly.
unused_result_ok = "warn"
# Model the problem using the type system: several bools in one struct or one
# signature usually encode a state or a mode that an enum would hold. Flags that
# are truly independent, such as a test fake's injected faults or key modifiers,
# say so with `#[expect(..., reason = "...")]` on the item.
struct_excessive_bools = "warn"
fn_params_excessive_bools = "warn"
