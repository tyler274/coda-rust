[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
version = "0.1.0"

# Lint rules for every crate except the generated duet-wire. A rule belongs here
# when it catches a mistake precisely and the right alternative is clear.
[workspace.lints.clippy]
# `result.ok();` hides a discarded error; `let _ = result;` keeps the discard visible.
unused_result_ok = "warn"
