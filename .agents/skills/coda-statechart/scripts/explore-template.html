<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working console. Left, where you are and what can happen next; right, the rules and journeys that judge it. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --ink: #16201e; --muted: #5a6865; --line: #d6dfdc;
  --accent: #0b6b63; --accent-ink: #ffffff; --accent-soft: #dceeea;
  --system: #5b4596; --system-soft: #ebe6f6;
  --ok: #2c7a3b; --ok-soft: #e1f1e3; --bad: #b42318; --bad-soft: #fbe5e2;
  --ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #161f1e; --ink: #e4ecea; --muted: #97a7a3; --line: #2a3735;
  --accent: #4cc0b2; --accent-ink: #062320; --accent-soft: #12352f;
  --system: #b7a2ea; --system-soft: #2a2442;
  --ok: #6cc47a; --ok-soft: #173321; --bad: #f2806f; --bad-soft: #3c1b17; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #161f1e; --ink: #e4ecea; --muted: #97a7a3; --line: #2a3735;
  --accent: #4cc0b2; --accent-ink: #062320; --accent-soft: #12352f;
  --system: #b7a2ea; --system-soft: #2a2442;
  --ok: #6cc47a; --ok-soft: #173321; --bad: #f2806f; --bad-soft: #3c1b17; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.verdict { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .9rem; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); } .verdict.bad { background: var(--bad-soft); color: var(--bad); }
.grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
.regions { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.region { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.region h3 { margin: 0 0 8px; font-size: .85rem; font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: .82rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill.changed { box-shadow: 0 0 0 3px var(--accent-soft); }
.moves { display: flex; flex-direction: column; gap: 8px; }
.move { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; text-align: left; width: 100%;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; cursor: pointer; }
.move:hover { border-color: var(--accent); }
.move:focus-visible, button:focus-visible, .jrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.who { grid-row: span 2; align-self: start; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.who.you { background: var(--accent-soft); color: var(--accent); } .who.sys { background: var(--system-soft); color: var(--system); }
.ev { font-weight: 600; }
.then { color: var(--muted); font-size: .85rem; }
.then b { color: var(--ink); font-weight: 500; }
.intent { grid-column: 2; color: var(--muted); font-size: .82rem; }
details.off { margin-top: 10px; color: var(--muted); font-size: .85rem; }
details.off ul { margin: 6px 0 0; padding-left: 18px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button.tool { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.tool:hover { border-color: var(--accent); }
button.tool:disabled { opacity: .45; cursor: default; }
ol.path { margin: 12px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; counter-reset: step; }
ol.path li { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 6px; font-size: .88rem; }
ol.path li::before { counter-increment: step; content: counter(step) "."; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
ol.path li button { all: unset; cursor: pointer; } ol.path li button:hover { color: var(--accent); }
ol.path li.here { font-weight: 600; }
.rule { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.rule:first-of-type { border-top: 0; padding-top: 0; }
.mark { font-weight: 700; font-size: .8rem; padding: 2px 8px; border-radius: 6px; align-self: start; }
.mark.ok { background: var(--ok-soft); color: var(--ok); } .mark.bad { background: var(--bad-soft); color: var(--bad); }
.rname { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.rsent { grid-column: 2; }
.rcount { grid-column: 2; color: var(--muted); font-size: .8rem; }
.jrow { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; border-top: 1px solid var(--line); padding: 9px 0; color: var(--ink); cursor: pointer; }
.jrow:first-of-type { border-top: 0; padding-top: 0; }
.jrow:hover .jname { color: var(--accent); }
.jname { font-weight: 600; }
.jmeta { color: var(--muted); font-size: .8rem; }
.jrow.active .jname { color: var(--accent); }
.jsteps { margin: 6px 0 0; padding-left: 20px; font-size: .84rem; color: var(--muted); }
.jsteps li.done { color: var(--ink); }
.chart { overflow-x: auto; }
.chart pre.mermaid { margin: 0; min-width: 900px; background: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.pill, .move { transition: background .15s, border-color .15s, box-shadow .15s; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <span class="verdict" id="verdict"></span>
  </header>

  <div class="grid">
    <div class="col">
      <section aria-labelledby="now-h">
        <h2 id="now-h">Where you are</h2>
        <div class="regions" id="regions"></div>
      </section>
      <section aria-labelledby="next-h">
        <h2 id="next-h">What can happen next</h2>
        <div class="moves" id="moves"></div>
        <details class="off" id="off"><summary></summary><ul></ul></details>
      </section>
      <section aria-labelledby="path-h">
        <h2 id="path-h">Your path</h2>
        <div class="toolbar">
          <button class="tool" id="back" type="button">Back one step</button>
          <button class="tool" id="restart" type="button">Start over</button>
        </div>
        <ol class="path" id="path"></ol>
      </section>
    </div>
    <div class="col">
      <section aria-labelledby="rules-h">
        <h2 id="rules-h">Rules, checked here</h2>
        <div id="rules"></div>
      </section>
      <section aria-labelledby="j-h">
        <h2 id="j-h">Journeys</h2>
        <div id="journeys"></div>
      </section>
    </div>
  </div>

  <section aria-labelledby="chart-h">
    <h2 id="chart-h">The chart</h2>
    <div class="chart"><pre class="mermaid" id="mermaid"></pre></div>
  </section>
</div>

<script type="application/json" id="model">__MODEL__</script>
<script>
const M = JSON.parse(document.getElementById("model").textContent);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const out = new Map();
M.edges.forEach((e) => { if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e); });
const allEvents = [...new Set(M.edges.map((e) => e.event))];
const isYou = (ev) => (M.events[ev]?.cause ?? "").toLowerCase() === "you";

let path = [{ state: M.start[0], event: null }];
let activeJourney = null;

$("title").textContent = M.title || "Chart explorer";
const broken = M.rules.filter((r) => r.broken.length);
$("sub").textContent = `${M.states.length} reachable states · ${M.edges.length} steps · ${M.rules.length} rules · ${M.journeys.length} journeys`;
const v = $("verdict");
if (!M.rules.length) { v.className = "verdict"; v.textContent = "No rules to check"; }
else if (broken.length) { v.className = "verdict bad"; v.textContent = `${broken.length} rule${broken.length > 1 ? "s" : ""} broken somewhere`; }
else { v.className = "verdict ok"; v.textContent = "Every rule holds in every reachable state"; }
$("mermaid").textContent = M.source.split("\n").filter((l) => !/^\s*%%/.test(l)).join("\n");

function go(state, event) { path.push({ state, event }); activeJourney = null; render(); }

function render() {
  const here = path[path.length - 1].state;
  const prev = path.length > 1 ? M.states[path[path.length - 2].state] : null;
  const s = M.states[here];

  const regions = $("regions"); regions.replaceChildren();
  M.regions.forEach((r, ri) => {
    const box = el("div", "region"); box.append(el("h3", null, r.caption));
    const pills = el("div", "pills");
    r.states.forEach((name) => {
      const p = el("span", "pill" + (s[ri] === name ? " on" : "") + (s[ri] === name && prev && prev[ri] !== name ? " changed" : ""), name);
      pills.append(p);
    });
    box.append(pills); regions.append(box);
  });

  const moves = $("moves"); moves.replaceChildren();
  const here_out = out.get(here) ?? [];
  here_out.forEach((e) => {
    const t = M.states[e.to];
    const changes = M.regions.map((r, ri) => (t[ri] !== s[ri] ? [r.caption, t[ri]] : null)).filter(Boolean);
    const b = el("button", "move"); b.type = "button";
    b.append(el("span", "who " + (isYou(e.event) ? "you" : "sys"), isYou(e.event) ? "You" : (M.events[e.event]?.cause || "System")));
    const line = el("span"); line.append(el("span", "ev", e.event));
    if (changes.length) {
      const then = el("span", "then"); then.append(" → ");
      changes.forEach(([cap, val], i) => { if (i) then.append(", "); then.append(cap + ": "); then.append(el("b", null, val)); });
      line.append(then);
    } else line.append(el("span", "then", " → nothing you can see changes"));
    b.append(line);
    if (M.events[e.event]?.intent) b.append(el("span", "intent", M.events[e.event].intent));
    b.addEventListener("click", () => go(e.to, e.event));
    moves.append(b);
  });
  if (!here_out.length) moves.append(el("p", "then", "Nothing can happen from here."));
  const possible = new Set(here_out.map((e) => e.event));
  const off = allEvents.filter((ev) => !possible.has(ev));
  const d = $("off");
  d.hidden = !off.length;
  d.querySelector("summary").textContent = `Can't happen here (${off.length})`;
  d.querySelector("ul").replaceChildren(...off.map((ev) => el("li", null, ev)));

  const pl = $("path"); pl.replaceChildren();
  path.forEach((p, i) => {
    const li = el("li", i === path.length - 1 ? "here" : "");
    const b = el("button", null, i === 0 ? "Start" : p.event);
    b.addEventListener("click", () => { path = path.slice(0, i + 1); activeJourney = null; render(); });
    li.append(b); pl.append(li);
  });
  $("back").disabled = path.length < 2;

  const rules = $("rules"); rules.replaceChildren();
  if (!M.rules.length) rules.append(el("p", "then", "This chart states no rules."));
  M.rules.forEach((r) => {
    const bad = r.broken.includes(here);
    const row = el("div", "rule");
    row.append(el("span", "mark " + (bad ? "bad" : "ok"), bad ? "Broken here" : "Holds"));
    row.append(el("span", "rname", r.name));
    row.append(el("span", "rsent", r.sentence));
    row.append(el("span", "rcount", r.broken.length ? `Broken in ${r.broken.length} of ${M.states.length} reachable states` : `Holds in all ${M.states.length} reachable states`));
    rules.append(row);
  });

  const js = $("journeys"); js.replaceChildren();
  if (!M.journeys.length) js.append(el("p", "then", "No journeys file was given."));
  M.journeys.forEach((j, ji) => {
    const b = el("button", "jrow" + (activeJourney === ji ? " active" : "")); b.type = "button";
    b.append(el("div", "jname", j.name));
    b.append(el("div", "jmeta", j.broken ? `Stops: "${j.broken}" can't happen` : `${j.steps.length} step${j.steps.length === 1 ? "" : "s"}${j.from ? ` · continues “${j.from}”` : ""}`));
    if (activeJourney === ji) {
      const ol = el("ol", "jsteps");
      j.steps.forEach((st) => ol.append(el("li", "done", `${st.event}${st.expect.length ? " → " + st.expect.join("; ") : ""}`)));
      b.append(ol);
    }
    b.addEventListener("click", () => playJourney(ji));
    js.append(b);
  });
}

function journeyPath(ji) {
  const j = M.journeys[ji];
  const before = j.from ? journeyPath(M.journeys.findIndex((x) => x.name === j.from)) : [{ state: M.start[0], event: null }];
  return before.concat(j.steps.map((st) => ({ state: st.state, event: st.event })));
}
function playJourney(ji) { path = journeyPath(ji); activeJourney = ji; render(); }

$("back").addEventListener("click", () => { if (path.length > 1) { path.pop(); activeJourney = null; render(); } });
$("restart").addEventListener("click", () => { path = [{ state: M.start[0], event: null }]; activeJourney = null; render(); });
render();
</script>
