# Local-only operations "backend": merged on top of collector.yaml when no
# Datadog Agent or Grafana stack runs
# (`--config collector.yaml --config collector.debug.yaml`). Lists replace on
# merge, so this keeps the content-stripping processors and swaps only the
# exporters: the debug output shows exactly what a real backend would receive.
service:
  pipelines:
    traces/ops:
      exporters: [debug]
    logs/ops:
      exporters: [debug]
