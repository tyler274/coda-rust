# Grafana requires a real receiver, even for shadow evaluation. Every alert
# matches the always-muted child route; there is no Slack integration here.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: coda-shadow
    receivers:
      - uid: coda-shadow
        type: email
        settings:
          addresses: shadow@example.test
muteTimes:
  - orgId: 1
    name: coda-shadow-always
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
policies:
  - orgId: 1
    receiver: coda-shadow
    group_by: [grafana_folder, alertname, service, service_name]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: coda-shadow
        mute_time_intervals: [coda-shadow-always]
        continue: false
