# Operational alerts evaluate but do not notify. Datadog owns service paging.
# A separately gated synthetic rule may reach the test-only Slack route.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: coda-shadow
    receivers: []
policies:
  - orgId: 1
    receiver: coda-shadow
    group_by: [grafana_folder, alertname, service, service_name]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
