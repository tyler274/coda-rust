# Shared local and GKE gateway policy. collector.gke.yaml adds caller auth.
# The operations pipelines (traces/ops, logs/ops) carry operational fields
# only; Langfuse receives generation content when the producer runs with
# CODA_TELEMETRY_CONTENT=full. Never forward Cloud Run stdout wholesale:
# only the explicit OTLP log path is covered here.
#
# The operations backend is chosen by one overlay merged LAST:
#   collector.datadog.yaml  otlp/datadog (Datadog Agent)
#   collector.grafana.yaml  otlp/tempo + otlphttp/loki
#   collector.both.yaml     all three independent operations exporters
#   collector.debug.yaml    debug exporter (local only)
# Without a backend overlay the ops pipelines export to nop: data is dropped,
# never sent somewhere unintended.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

  # This is an allowlist, not a vocabulary of possible content key names.
  # Retained values are product-owned operational metadata, not arbitrary text.
  # Free-form errors, status descriptions, event names and log bodies are never
  # exported. Error codes and severity remain available for grouping/alerts.
  transform/strip_content:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.namespace", "deployment.environment", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: scope
        statements:
          - keep_keys(attributes, [])
      - context: span
        statements:
          - keep_keys(attributes, ["http.request.method", "http.route", "http.response.status_code", "messaging.system", "messaging.destination.name", "messaging.operation.name", "messaging.operation.type", "messaging.message.id", "messaging.gcp_pubsub.message.delivery_attempt", "coda.run_id", "coda.work_id", "coda.predecessor_run_id", "coda.input_revision", "coda.attempt_number", "coda.trace_relation", "coda.delivery_kind", "coda.republished", "coda.job", "coda.outcome", "coda.recipe_version", "coda.origin", "coda.scenario_id", "coda.adapter", "gen_ai.system", "gen_ai.request.model", "gen_ai.response.model", "gen_ai.operation.name", "gen_ai.usage.input_tokens", "gen_ai.usage.output_tokens", "error.type"])
          - set(status.message, "")
          # Only known instrumentation names survive; callers may otherwise
          # put free text into a span name. HTTP route remains a safe attribute.
          - set(name, "operation") where not IsMatch(name, "^(gen_ai\\.generation|http\\.server|physician\\.(worker\\.attempt|queue\\.publish|recovery\\.sweep)|duet\\.((recovery|privacy_recovery)\\.sweep|conversation\\.execute)|codex\\.exec|coda\\.simulation)$")
          - set(name, "http.server") where attributes["http.request.method"] != nil
      - context: spanevent
        statements:
          - keep_keys(attributes, ["event", "step", "error_class", "error.type", "coda.run_id", "coda.job", "coda.outcome", "status", "latency_ms"])
          - set(name, "operational.event")
  transform/strip_log_content:
    error_mode: propagate
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.namespace", "deployment.environment", "deployment.environment.name", "telemetry.sdk.name", "telemetry.sdk.language", "telemetry.sdk.version"])
      - context: scope
        statements:
          - keep_keys(attributes, [])
      - context: log
        statements:
          - keep_keys(attributes, ["event", "step", "error_class", "error.type", "coda.run_id", "coda.work_id", "coda.predecessor_run_id", "coda.job", "coda.outcome", "coda.attempt_number", "http.request.method", "http.route", "http.response.status_code", "status", "latency_ms"])
          - set(body, "operational.event")
          - set(severity_text, "")

  filter/langfuse_generations:
    error_mode: propagate
    traces:
      span:
        - >-
          attributes["langfuse.observation.type"] != "generation" and
          attributes["gen_ai.system"] == nil and
          attributes["gen_ai.request.model"] == nil and
          attributes["gen_ai.operation.name"] == nil and
          attributes["gen_ai.usage.input_tokens"] == nil and
          attributes["gen_ai.usage.output_tokens"] == nil

exporters:
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
    auth:
      authenticator: basicauth/langfuse
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 1000
      block_on_overflow: false
    retry_on_failure:
      max_elapsed_time: 30s
  debug:
    verbosity: detailed
  nop: {}

service:
  extensions: [health_check, basicauth/langfuse]
  pipelines:
    traces/ops:
      receivers: [otlp]
      processors: [memory_limiter, transform/strip_content, batch]
      exporters: [nop]
    traces/langfuse:
      receivers: [otlp]
      processors: [memory_limiter, filter/langfuse_generations, batch]
      exporters: [otlphttp/langfuse]
    logs/ops:
      receivers: [otlp]
      processors: [memory_limiter, transform/strip_log_content, batch]
      exporters: [nop]
