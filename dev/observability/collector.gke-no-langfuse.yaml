# Merged after collector.yaml and collector.gke.yaml only while the GKE
# gateway runs without Langfuse (infra/gcp/observability langfuse_enabled =
# false). The Datadog pipelines are unchanged. Generation spans still pass
# the caller and generation filters, then go to nop instead of Langfuse, so
# no Langfuse endpoint or keys are needed. The extension list drops
# basicauth/langfuse; lists replace on merge, so it is restated in full.
exporters:
  nop: {}

service:
  extensions: [health_check, oidc]
  pipelines:
    traces/langfuse:
      exporters: [nop]
