# cargo-deny guardrails for CI (ENG-60).
# Run: cargo deny --all-features check advisories bans licenses sources
# CI: .github/workflows/ci.yml, step `Check dependency guardrails`.
#
# Thresholds start where the tree actually is: vulnerabilities and unknown
# sources fail the build; duplicates, wildcards, and unmaintained crates are
# warnings to work down, not lies to hide.

[graph]
# Check all targets so a Windows-only or wasm-only advisory still trips.
all-features = true

[licenses]
version = 2
# The workspace crates are private (publish = false, license = UNLICENSED);
# guardrails apply to what we ship and depend on, not to this repo itself.
private = { ignore = true }
# Allow only permissive licenses; anything copyleft needs an explicit entry.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # libfuzzer-sys links LLVM's libFuzzer runtime, which is NCSA-licensed.
    # It is an image-optimizer dev path through dioxus-desktop, never shipped.
    "NCSA",
]
# Font data is licensed per crate, never workspace-wide. duet-page embeds the
# Noto faces from oxifont-bundled in the doctor-page PDF; the OFL permits
# embedding and redistribution with the software (ENG-46).
exceptions = [
    { allow = ["OFL-1.1"], crate = "oxifont-bundled" },
]
# Confidence threshold for license detection inside files.
confidence-threshold = 0.93

[bans]
# Start as warnings: the tree carries 58 duplicate versions today. Tighten to
# `deny` per-duplicate with `skip` entries as they are collapsed.
multiple-versions = "warn"
# Workspace path dependencies are declared without versions by convention.
wildcards = "warn"
deny = []

[advisories]
version = 2
# Vulnerabilities still fail. These four are transitive unmaintained crates
# with no safe upgrade; each is tracked for replacement.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "unsafe-libyaml via serde_yaml 0.9 in agent-skills; replace serde_yaml or move to saphyr" },
    { id = "RUSTSEC-2024-0449", reason = "proc-macro-error is unmaintained; transitive via darling/syn struct generators" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained; transitive via rustc-hash users" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; transitive via strum macros" },
    # duet-page reads glyph outlines from its bundled fonts only; cosmic-text
    # (fontdb) and oxifont-parser pin the same crate. Replace with skrifa when
    # those move (ENG-46).
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; parses only bundled fonts in duet-page, also via fontdb/oxifont-parser (ENG-46)" },
    # zip 8.6.0 is pinned by candle-core 0.11.0 (latest, requires zip ^8.6.0).
    # All three advisories are in ZipArchive/ZipStreamReader::extract(); candle
    # only reads entries in memory via by_name/by_index and never extracts, and
    # encoder loads safetensors. Drop these when candle moves to zip >= 9 (ENG-108).
    { id = "RUSTSEC-2026-0367", reason = "zip extract() keeps SUID/SGID bits; unreachable, candle-core never extracts (ENG-108)" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract() symlink escape; unreachable, candle-core never extracts (ENG-108)" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract() chmod through symlinks; unreachable, candle-core never extracts (ENG-108)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
