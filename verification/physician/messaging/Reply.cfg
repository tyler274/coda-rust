\* Two patients, so a correction can move the reply to someone a physician may not access; two
\* physicians, so the reply is shared and drafts are each their own; the patient writes twice, so the
\* reply can fall behind; one practice message; one correction. No disconnect: no rule here reads the
\* channel or the disconnected line, and a disconnect only delays Coda's next read, which the model
\* already allows, so it can break none of them. The model keeps the steps, and the charts draw them.
SPECIFICATION Spec
VIEW state
SYMMETRY Symmetry
CONSTANTS
  Patients = {p1, p2}
  Physicians = {d1, d2}
  MayFlag = TRUE
  MaxPatientMessages = 2
  MaxPracticeMessages = 1
  MaxCorrections = 1
  MaxDisconnects = 0
INVARIANT OnlyWithAccess
INVARIANT OnlyTheReviewAnswers
PROPERTY ConcernStays
PROPERTY YourWords
PROPERTY CopiesWhatYouSee
INVARIANT CurrentReply
INVARIANT WhatWasSent
