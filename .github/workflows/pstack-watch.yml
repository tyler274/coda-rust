name: PStack verification skill updates

on:
  schedule:
    - cron: '43 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pstack-verification-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Compare and push skill updates
        id: sync
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: codex/update-pstack-skills
        # Git sends a credential helper's token only after a 401, which a
        # public repository never returns. The header goes on every request,
        # including the blobs the partial clone fetches lazily during the sync
        # and pushing the update branch when changes are present.
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git clone --branch main --single-branch --filter=blob:none --no-checkout https://github.com/cursor/plugins.git "$RUNNER_TEMP/cursor-plugins"
          scripts/sync-pstack.sh "$RUNNER_TEMP/cursor-plugins"

          echo "base_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- .agents/skills/ verification/PSTACK-LICENSE verification/README.md)" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
              git push origin --delete "$UPDATE_BRANCH" || true
            fi
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .agents/skills/ verification/PSTACK-LICENSE verification/README.md
          git commit -m 'Update PStack verification skills'
          git push --force origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          echo "has_updates=true" >> "$GITHUB_OUTPUT"

      - name: Publish review PR or tracking issue
        uses: actions/github-script@v9
        env:
          HAS_UPDATES: ${{ steps.sync.outputs.has_updates }}
          BASE_BRANCH: ${{ steps.sync.outputs.base_branch }}
          UPDATE_BRANCH: codex/update-pstack-skills
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- coda-pstack-watch -->';
            const base = process.env.BASE_BRANCH || 'main';
            const branch = process.env.UPDATE_BRANCH || 'codex/update-pstack-skills';
            const hasUpdates = process.env.HAS_UPDATES === 'true';
            const readme = fs.readFileSync('verification/README.md', 'utf8');
            const revMatch = readme.match(/\[PStack at ([0-9a-f]+)\]\((https:\/\/github\.com\/cursor\/plugins\/tree\/([0-9a-f]{40})\/pstack\/skills)\)/);
            if (!revMatch) throw new Error('Expected upstream PStack revision link in verification/README.md');
            const [, shortSha, upstreamUrl, fullSha] = revMatch;
            const revisionMarker = `<!-- upstream-revision:${fullSha} -->`;
            const { owner, repo } = context.repo;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100
            });
            const existingIssue = issues.find(
              i => !i.pull_request && i.user?.login === 'github-actions[bot]' && i.body?.includes(marker)
            );

            if (!hasUpdates) {
              if (existingIssue && existingIssue.state === 'open') {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: existingIssue.number,
                  state: 'closed',
                  body: `${existingIssue.body}\n\nClosed automatically: \`${base}\` matches upstream PStack [${shortSha}](${upstreamUrl}).`
                });
                core.notice(`Closed tracking issue: ${existingIssue.html_url}`);
              }
              await core.summary.addHeading('PStack verification skills')
                .addRaw(`Up to date on \`${base}\` at [${shortSha}](${upstreamUrl}).\n`)
                .write();
              return;
            }

            const title = 'Update PStack verification skills';
            const body = `Review the imported verification skills updated to [${shortSha}](${upstreamUrl}) (linked in \`verification/README.md\`).`;
            const { data: openPrs } = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 10
            });

            if (openPrs.length > 0) {
              const pr = openPrs[0];
              await github.rest.pulls.update({
                ...context.repo, pull_number: pr.number, title, body
              });
              if (existingIssue && existingIssue.state === 'open') {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existingIssue.number, state: 'closed'
                });
              }
              core.notice(`Updated PStack PR: ${pr.html_url}`);
              await core.summary.addHeading('PStack verification skills')
                .addRaw(`Updated PR #${pr.number} for [${shortSha}](${upstreamUrl}): ${pr.html_url}\n`)
                .write();
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.create({
                ...context.repo, title, head: branch, base, body
              });
              if (existingIssue && existingIssue.state === 'open') {
                await github.rest.issues.update({
                  ...context.repo, issue_number: existingIssue.number, state: 'closed'
                });
              }
              core.notice(`Opened PStack PR: ${pr.html_url}`);
              await core.summary.addHeading('PStack verification skills')
                .addRaw(`Opened PR #${pr.number} for [${shortSha}](${upstreamUrl}): ${pr.html_url}\n`)
                .write();
              return;
            } catch (error) {
              const isPrForbidden = error?.status === 403 &&
                /not permitted to create or approve pull requests/i.test(error?.message ?? '');
              if (!isPrForbidden) throw error;
            }

            const compareUrl = `https://github.com/${owner}/${repo}/compare/${base}...${branch}?expand=1`;
            const issueTitle = `PStack verification skills update (${shortSha})`;
            const issueBody = `${marker}\n${revisionMarker}\n` +
              `Upstream PStack verification skills changed to [${shortSha}](${upstreamUrl}) (linked in \`verification/README.md\`).\n\n` +
              `GitHub Actions pushed branch \`${branch}\`, and repository settings prevent workflows from opening pull requests directly.\n\n` +
              `- [Open review PR](${compareUrl})\n`;

            let trackingUrl = existingIssue?.html_url ?? compareUrl;
            if (!existingIssue) {
              const { data: created } = await github.rest.issues.create({
                ...context.repo, title: issueTitle, body: issueBody
              });
              trackingUrl = created.html_url;
              core.notice(`PStack tracking issue opened: ${trackingUrl}`);
            } else if (existingIssue.state === 'open' || !existingIssue.body.includes(revisionMarker)) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existingIssue.number,
                state: 'open',
                title: issueTitle,
                body: issueBody
              });
              core.notice(`PStack tracking issue updated: ${trackingUrl}`);
            } else {
              core.notice(`Already tracked: ${trackingUrl}`);
            }

            await core.summary.addHeading('PStack verification skills')
              .addRaw(`Pushed \`${branch}\` for [${shortSha}](${upstreamUrl}); PR creation is disabled by repository settings, tracking at ${trackingUrl}.\n`)
              .write();
