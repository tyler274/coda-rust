name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        # GitHub has neither the local duet emulator nor the Node practice on
        # port 8787. Those two tests fail closed when they run; they are not
        # counted as passed here.
        run: cargo test --workspace -- --skip the_android_shell_shows_both_modes --skip the_live_react_practice_matches_the_rust_page
      - name: Install mdBook
        run: cargo install mdbook --version 0.4.52 --locked
      - name: Build the book and the rustdoc
        run: |
          mdbook build book
          cargo doc --no-deps --workspace
