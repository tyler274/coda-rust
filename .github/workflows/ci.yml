name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        # GitHub has no Node practice on port 8787. That comparison fails
        # closed when it runs; it is not counted as passed here. The Android
        # shell is proved by UI Automator on a local emulator, not by this job.
        run: cargo test --workspace -- --skip the_live_react_practice_matches_the_rust_page
      - name: Install mdBook
        run: cargo install mdbook --version 0.4.52 --locked
      - name: Check the Doppler installer
        run: bash -n scripts/gcp/install_doppler.sh
      - name: Build the book and the rustdoc
        run: |
          mdbook build book
          cargo doc --no-deps --workspace
