name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# Only a newer revision of the same PR cancels validation. Main pushes and
# manual runs remain distinct; deployment concurrency stays with each deploy job.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Saving the Rust build cache needs this. The default token is contents-only.
  actions: write

jobs:
  scope:
    name: Select CI scope
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete change
        id: select
        run: python3 scripts/ci_scope.py select

  lightweight:
    name: Documentation and engineering skills
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install skill-validation dependency
        run: python3 -m pip install -r scripts/ci-requirements.txt
      - name: Test CI selection and skill validation
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v
      - name: Validate engineering skills and script syntax
        run: python3 scripts/check_engineering_skills.py
      - name: Test PR review launcher without model calls
        run: python3 -m unittest discover -s .agents/skills/review-pr/scripts -p 'test_*.py' -v
      - name: Test proof capture against a scratch repository
        run: python3 -m unittest discover -s .agents/skills/capture-proof/scripts -p 'test_*.py' -v
      - name: Install mdBook
        run: |
          version=0.4.52
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 755 /tmp/mdbook "${CARGO_HOME:-$HOME/.cargo}/bin/mdbook"
          mdbook --version
      # lychee 0.24.2 matches flake `lychee`. Static musl build, so it does
      # not depend on the runner's glibc.
      - name: Install lychee
        run: |
          version=0.24.2
          archive="lychee-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 755 /tmp/lychee-x86_64-unknown-linux-musl/lychee "${CARGO_HOME:-$HOME/.cargo}/bin/lychee"
          lychee --version
      - name: Check engineering-skill references
        run: lychee --offline --no-progress --include-fragments --root-dir "$PWD" '.agents/skills/**/*.md'
      - name: Build the book and check its links
        run: scripts/check-book-links.sh

  result:
    name: CI result
    if: always()
    needs: [scope, lightweight, ci, foundations, images, postgres, observability, cargo-deny]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_scope.py result

  ci:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    # Blacksmith runner (ENG-76): same image as GitHub's ubuntu-24.04, and
    # actions/cache talks to Blacksmith's colocated cache with no change.
    # 4 vCPU because this job compiles the workspace; cargo-deny below stays
    # on 2 vCPU. Roll back by setting runs-on to ubuntu-latest again.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The Duet, physician and front-door PostgreSQL proofs fail closed without
    # a disposable loopback server; they never skip (ENG-46). Each test creates
    # and drops its own database and role on this throwaway container.
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Point the PostgreSQL proofs at the service
        run: |
          url="postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres"
          {
            echo "DUET_TEST_DATABASE_URL=${url}"
            echo "PHYSICIAN_TEST_DATABASE_URL=${url}"
            echo "FRONT_DOOR_TEST_DATABASE_URL=${url}"
          } >> "$GITHUB_ENV"
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Original-source parity snapshots are committed test fixtures.
          # Optional developer references are never fetched by CI.
          submodules: false
          persist-credentials: false
      - name: Install Node for public-site assets
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test Doppler release and security watch
        run: node --test crates/workspace-tools/tests/doppler-watch.test.cjs
      - name: Test staging image handoff
        run: python3 -m unittest discover -s scripts -p 'test_staging_images.py' -v
      - name: Test engineering workstation transport without provider or model calls
        run: |
          python3 -m venv "$RUNNER_TEMP/engineering-workstation-venv"
          "$RUNNER_TEMP/engineering-workstation-venv/bin/python" -m pip install --disable-pip-version-check \
            -r infra/engineering-workstation/bridge/requirements.txt \
            -r infra/engineering-workstation/bridge/requirements-github.txt
          "$RUNNER_TEMP/engineering-workstation-venv/bin/python" -m unittest discover \
            -s infra/engineering-workstation/bridge -p 'test_*.py' -v
      # Preinstalled SDKs are unused here and leave no room to archive target
      # beside itself (run 39309157954, ENOSPC during cache save). The build,
      # proofs, and archive peaked at 16 GB plus a 9.6 GB archive reserve
      # (run 39452707783), so 40 GiB free skips the two-minute delete.
      - name: Free runner disk
        run: |
          df -h /
          avail_gib=$(( $(df -B1 --output=avail / | awk 'NR==2 { print $1 }') / 1073741824 ))
          if [ "$avail_gib" -ge 40 ]; then
            echo "${avail_gib} GiB free; skipping SDK removal"
            exit 0
          fi
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Release binary, not `cargo install`; matches the flake pin.
      - name: Install wasm-bindgen
        run: |
          version=0.2.129
          archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 755 "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" "${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"
          wasm-bindgen --version
      - name: Rustc version
        id: rustc
        run: |
          version="$(rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
            rust-v2-${{ runner.os }}-
      # This command builds workspace-tools; restore its dependencies first.
      # The release is still downloaded and verified on every run.
      - name: Verify pinned Doppler download and installed version
        run: |
          cargo run --locked -p workspace-tools -- install-doppler "$RUNNER_TEMP/doppler"
          expected=$(python3 -c 'from pathlib import Path; print(Path("crates/workspace-tools/src/doppler.rs").read_text().split("pub const VERSION: &str = ")[1].split(chr(34))[1])')
          test "$("$RUNNER_TEMP/doppler" --version)" = "$expected"
      # Browser proofs build their WebAssembly bundles offline. A restored
      # native build cache is not guaranteed to contain target-only crates.
      - name: Fetch locked browser build dependencies
        if: github.event_name == 'workflow_dispatch'
        run: cargo fetch --locked --target wasm32-unknown-unknown
      - name: Install Chromium
        if: github.event_name == 'workflow_dispatch'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      # The routine duet-page renderer test needs independent PDF extraction and
      # rasterization; Poppler is required even when browser tests are not run.
      - name: Install PDF proof and static-build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils musl-tools
      - name: Check formatting
        run: cargo fmt --check
      # CI parity with the pre-commit hook (.githooks/pre-commit): a commit
      # that slips past --no-verify still faces clippy here, warnings denied.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Browser tests are explicitly ignored by Rust's test harness. Routine
      # checks still run every package's unit, service, storage and HTTP tests.
      - name: Test workspace libraries and services
        run: cargo test --workspace
      - name: Run explicitly requested browser qualification
        if: github.event_name == 'workflow_dispatch'
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
          PUBLIC_SITE_SCREENSHOTS: ${{ runner.temp }}/public-site-screenshots
        # Select browser targets only; other ignored tests have their own jobs.
        # React comparison still requires a separate practice on port 8787.
        # backend_process is a child-only helper, launched by its parent proof.
        run: |
          cargo test -p physician-sample --test site --test auth_browser -- --ignored
          cargo test -p public-site --test site -- --ignored
          cargo test -p mobile --test browser --test duet_journey --test mode -- --ignored --skip backend_process
      - name: Upload public-site browser screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: public-site-browser
          path: ${{ runner.temp }}/public-site-screenshots
          if-no-files-found: ignore
      # Keep a native Linux build for operator-run staging qualification before
      # merge. The artifact cannot publish or deploy, and carries its source SHA.
      - name: Build public-site PR binary
        if: github.event_name == 'pull_request'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          RUSTFLAGS: -C target-feature=+crt-static -C strip=symbols
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release -p public-site --bin public-site --target x86_64-unknown-linux-musl
          binary=target/x86_64-unknown-linux-musl/release/public-site
          readelf -lW "$binary" > "$RUNNER_TEMP/public-site-elf"
          if grep -q INTERP "$RUNNER_TEMP/public-site-elf"; then
            echo '::error::public-site must be a static executable'
            exit 1
          fi
          mkdir -p public-site-pr-binary
          cp "$binary" public-site-pr-binary/public-site
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('public-site-pr-binary')
          binary = output / 'public-site'
          (output / 'source.json').write_text(json.dumps({
              'source_revision': os.environ['SOURCE_REVISION'],
              'pr_head_revision': os.environ['PR_HEAD_REVISION'],
              'binary_sha256': hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest(),
              'target': 'x86_64-unknown-linux-musl',
          }, indent=2) + '\n')
          PY
      - name: Save public-site PR binary
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: public-site-pr-binary-${{ github.sha }}
          path: public-site-pr-binary
          retention-days: 3
      # The archive is written beside target, so free space has to hold that
      # second copy. Drop proof outputs, then build-script dirs if it is
      # still tight. Registry is always saved. A target that does not fit
      # is not saved under the primary key. Caching is best effort: a cold
      # next build must not invalidate the proofs from this run.
      - name: Prepare Rust cache payload
        id: cache-payload
        continue-on-error: true
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf target/wasm32-unknown-unknown target/debug/incremental target/doc target/debug/examples
          if [ -d target/debug ]; then
            find target/debug -maxdepth 1 -type f -delete
            # Linked test and bin executables are workspace outputs, relinked
            # on the next run; the cache exists for dependency artifacts.
            # They doubled the payload once the Duet suites landed (ENG-46).
            # Extensionless only: rlibs, rmeta and proc-macro .so stay.
            find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.*' -delete
          fi
          sudo rm -rf /opt/hostedtoolcache/setup-chrome || true
          free_bytes() { df -B1 --output=avail / | awk 'NR==2 { print $1 }'; }
          payload_bytes() {
            local bytes=0 path size
            for path in "$HOME/.cargo/registry/index" "$HOME/.cargo/registry/cache" "$HOME/.cargo/git/db" ${1:+target}; do
              if [ -e "$path" ]; then
                size="$(du -sb "$path" | awk '{ print $1 }')"
                bytes=$((bytes + size))
              fi
            done
            echo "$bytes"
          }
          fits() {
            local payload free need
            payload="$(payload_bytes "$1")"
            free="$(free_bytes)"
            # zstd of these artifacts is smaller than the payload. Require
            # two thirds plus 1 GiB so the archive is not written into a full disk.
            need=$((payload * 2 / 3 + 1073741824))
            echo "include_target=${1:-false} payload=${payload} free=${free} need=${need}"
            [ "$free" -ge "$need" ]
          }
          include_target=true
          if ! fits true; then
            rm -rf target/debug/build
            if ! fits true; then
              include_target=false
              rm -rf target
              fits false || true
            fi
          fi
          echo "include_target=${include_target}" >> "$GITHUB_OUTPUT"
          df -h
      - name: Save Rust build cache
        continue-on-error: true
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save cargo registry without target
        continue-on-error: true
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}-registry
      - name: Report uncached build artifacts
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target != 'true'
        run: |
          echo "::warning::Compiled target was not cached. The next run may build cold; test results are unaffected."
      # After a clean, cargo doc recompiled 215 crates (2.5 min,
      # run 39452707783).
      # With the cache saved, 30 GB was still free at this point on
      # ubuntu-latest. The clean runs only when free space drops under
      # 15 GiB, so docs can reuse the dependency metadata already built.
      - name: Free build artifacts
        run: |
          df -h /
          avail_gib=$(( $(df -B1 --output=avail / | awk 'NR==2 { print $1 }') / 1073741824 ))
          if [ "$avail_gib" -lt 15 ]; then
            echo "${avail_gib} GiB free; cleaning target before docs"
            cargo clean
          else
            echo "${avail_gib} GiB free; keeping target for cargo doc"
          fi
      - name: Build the rustdoc
        run: cargo doc --no-deps --workspace

  foundations:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    name: Offline cloud foundation contracts
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check infrastructure source and SQL authority contracts
        run: |
          nix develop .#release --command python infra/gcp/rust-environments/tests/check_contract.py
          nix develop .#release --command python infra/gcp/rust-environments/tests/test_sql_grants.py
      - name: Prove mocked release adapters (no cloud credentials)
        run: nix develop .#release --command python -m unittest discover -s scripts/gcp -p 'test_release*.py' -v
      - name: Validate production mail infrastructure without cloud access
        run: |
          nix develop .#release --command tofu fmt -check -recursive infra/gcp/shared-mail
          nix develop .#release --command tofu -chdir=infra/gcp/shared-mail init -backend=false -input=false
          nix develop .#release --command tofu -chdir=infra/gcp/shared-mail validate
          nix develop .#release --command tofu -chdir=infra/gcp/shared-mail test
      - name: Validate public-site infrastructure without cloud access
        run: |
          nix develop .#release --command tofu fmt -check -recursive infra/gcp/public-site
          nix develop .#release --command tofu -chdir=infra/gcp/public-site init -backend=false -input=false
          nix develop .#release --command tofu -chdir=infra/gcp/public-site validate
          nix develop .#release --command tofu -chdir=infra/gcp/public-site test
      # Adapter tests do not authorize deployment. The staging rollout is the
      # deploy-staging job below; hosted runtime qualification is separate.

  # Builds every runtime, migration and job image with Nix on PRs and main and
  # runs them locally; this job pushes nothing. deploy-staging publishes them to
  # Artifact Registry on main (ENG-167).
  images:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    name: Locked Nix images (build, run, migrate; no push)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      tested-artifact-id: ${{ steps.tested-images.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      # Archives, Doppler entrypoint and fail-closed starts, disposable
      # Postgres migrations run twice, /health 200, /readyz 503, SIGTERM.
      # Hosted readiness and live journeys remain separate gates.
      - name: Build and prove runtime, migration and job images
        run: nix develop .#release --command bash scripts/check-images.sh
      - name: Record image sizes and store paths
        run: |
          {
            echo '| Image archive | Size |'
            echo '| --- | --- |'
            while read -r archive; do
              echo "| \`$archive\` | $(du -h --apparent-size "$archive" | cut -f1) |"
            done < image-paths
          } >> "$GITHUB_STEP_SUMMARY"
      # Exercise the handoff with the real Nix archives on PRs too. Retain it
      # only for enabled main deployments, passing its immutable artifact ID
      # so a failed deployment rerun reuses the original successful proof.
      - name: Package tested staging images
        run: |
          python3 scripts/staging_images.py package image-paths tested-images --revision "$GITHUB_SHA"
          python3 scripts/staging_images.py verify tested-images --revision "$GITHUB_SHA"
      - name: Save tested staging images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RUST_STAGING_DEPLOY == 'enabled'
        id: tested-images
        uses: actions/upload-artifact@v7
        with:
          name: tested-staging-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: tested-images/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      # An operator can test the exact PR image on staging before merging.
      # This job retains the already-tested archive; it has no cloud credentials
      # and cannot publish or deploy it.
      - name: Retain tested physician PR image
        if: github.event_name == 'pull_request'
        env:
          SOURCE_REVISION: ${{ github.sha }}
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, tarfile
          from pathlib import Path
          matches = []
          for line in Path('image-paths').read_text().splitlines():
              with tarfile.open(line) as archive:
                  manifest = json.load(archive.extractfile('manifest.json'))
              if any(tag.startswith('coda-physician-sample:')
                     for entry in manifest for tag in entry.get('RepoTags', [])):
                  matches.append(Path(line))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one tested physician image')
          output = Path('physician-pr-image')
          output.mkdir()
          target = output / 'physician-image.tar.gz'
          shutil.copyfile(matches[0], target)
          digest = hashlib.file_digest(target.open('rb'), 'sha256').hexdigest()
          (output / 'source.json').write_text(json.dumps({
              'source_revision': os.environ['SOURCE_REVISION'],
              'pr_head_revision': os.environ['PR_HEAD_REVISION'],
              'archive_sha256': digest,
              'archive': target.name,
          }, indent=2) + '\n')
          PY
      - name: Save tested physician PR image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: physician-pr-image-${{ github.sha }}
          path: physician-pr-image
          retention-days: 3
          compression-level: 0

  postgres:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    name: Fresh Postgres migrations and tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 16 + pgvector matches flake.nix and the devcontainer.
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CODA_REQUIRE_POSTGRES_TESTS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Cache Postgres proof build
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: postgres-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            postgres-${{ runner.os }}-
      - name: Check authored SQL formatting
        run: nix develop .#agent --command python scripts/check-sql.py
      - name: Apply fresh migrations, rerun, and exercise Postgres stores
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          PHYSICIAN_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/physician_ci
          FRONT_DOOR_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/front_door_ci
          DUET_IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/front_door_ci
          PHYSICIAN_RUNTIME_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/physician_ci
        run: |
          nix develop .#agent --command createdb --maintenance-db "$MIGRATION_DATABASE_URL" front_door_ci
          nix develop .#agent --command createdb --maintenance-db "$MIGRATION_DATABASE_URL" physician_ci
          nix develop .#agent --command bash scripts/check-postgres.sh

  # Rebuilds the public marketing site from this main commit, pushes it by
  # digest to the private public-site repository and applies the staging
  # OpenTofu root (book/src/public-site.md). It authenticates through the
  # github-actions WIF provider, which admits only main in environment
  # `staging`, as public-site-ci-deployer, whose grants are scoped to this
  # one service. The saved plan may only update the Cloud Run service in
  # place; anything else fails before apply. Off unless the repository
  # variable PUBLIC_SITE_STAGING_DEPLOY is `enabled`.
  deploy-public-site-staging:
    name: Deploy public site to staging
    needs: [scope, result]
    if: needs.scope.outputs.full == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PUBLIC_SITE_STAGING_DEPLOY == 'enabled'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    concurrency:
      group: public-site-staging-release
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.codahealth.ai
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-east1
      PROJECT: coda-health-staging
      SERVICE: public-site-staging
      REPOSITORY: us-east1-docker.pkg.dev/coda-health-staging/public-site/public-site
      ROOT: infra/gcp/public-site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Authenticate as the public-site CI deployer
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/134570912572/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: public-site-ci-deployer@coda-health-staging.iam.gserviceaccount.com
          token_format: access_token
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Build the image from the private base repositories
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --platform=linux/amd64 -f crates/public-site/Dockerfile \
            -t "public-site:${GITHUB_SHA}" .
      - name: Smoke the image locally
        run: nix develop .#release --command python3 infra/gcp/public-site/smoke.py "public-site:${GITHUB_SHA}"
      - name: Push by digest
        id: push
        run: |
          set -euo pipefail
          # Tags are immutable. A rerun of this commit reuses its published
          # digest instead of overwriting it.
          if ! gcloud artifacts docker images describe "${REPOSITORY}:${GITHUB_SHA}" >/dev/null 2>&1; then
            docker tag "public-site:${GITHUB_SHA}" "${REPOSITORY}:${GITHUB_SHA}"
            docker push "${REPOSITORY}:${GITHUB_SHA}"
          fi
          digest=$(gcloud artifacts docker images describe "${REPOSITORY}:${GITHUB_SHA}" --format='value(image_summary.digest)')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${GITHUB_SHA}"; exit 1; }
          echo "image=${REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${REPOSITORY}@${digest}" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the staging root
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          tofu() { nix develop .#release --command tofu -chdir="$ROOT" "$@"; }
          tofu init -input=false -backend-config=backend/staging.gcs.tfbackend
          # env/staging.tfvars holds the reviewed non-secret inputs; this run
          # supplies only the new image digest and release SHA.
          tofu plan -input=false -lock-timeout=5m -var-file=env/staging.tfvars \
            -var "image=${IMAGE}" -var "release_sha=${GITHUB_SHA}" -out=staging.tfplan
          tofu show -json staging.tfplan > plan.json
          # Allow only an in-place update of the Cloud Run service (or nothing).
          unexpected=$(jq -r '[.resource_changes[]
            | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | select(.address != "google_cloud_run_v2_service.site" or .change.actions != ["update"])
            | "\(.address): \(.change.actions | join(","))"] | .[]' plan.json)
          if [ -n "$unexpected" ]; then
            echo "::error::The plan changes more than the site service:"
            echo "$unexpected"
            exit 1
          fi
      - name: Apply the saved plan
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: nix develop .#release --command tofu -chdir="$ROOT" apply -input=false -lock-timeout=5m staging.tfplan
      - name: Verify the revision and the IAP gate
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          service=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format=json)
          ready=$(jq -r '.status.latestReadyRevisionName' <<<"$service")
          created=$(jq -r '.status.latestCreatedRevisionName' <<<"$service")
          served=$(jq -r '.spec.template.spec.containers[0].image' <<<"$service")
          [ "$ready" = "$created" ] || { echo "::error::latest revision $created is not Ready ($ready is)"; exit 1; }
          [ "$served" = "$IMAGE" ] || { echo "::error::service image $served, expected $IMAGE"; exit 1; }
          jq -e '[.status.traffic[] | select(.latestRevision == true) | .percent] | add == 100' <<<"$service" >/dev/null \
            || { echo "::error::the latest revision does not serve all traffic"; exit 1; }
          url=$(jq -r '.status.url' <<<"$service")
          for target in "$url/" "$url/health" "https://staging.codahealth.ai/"; do
            location=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "$target")
            case "$location" in
              "302 https://accounts.google.com/"*) echo "$target -> Google sign-in" ;;
              *) echo "::error::$target answered '$location' without IAP sign-in"; exit 1 ;;
            esac
          done
          echo "Revision $ready serves $IMAGE behind IAP" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the exact archives tested by images (no rebuild), then rolls the
  # physician and Duet runtime and migration images, plus physician-worker,
  # out to staging by digest. Each migration job runs to completion before its service
  # moves to the new runtime digest and must report a Ready revision serving
  # it. physician-worker is updated once that Cloud Run service exists; the
  # first push only publishes the digest so the scaling plan can pin it.
  # Cloud Run only shifts traffic to a revision that passes its /readyz
  # startup probe, so a failed rollout leaves the previous revision serving.
  # Only a push to main, after every check job is green.
  #
  # This direct rollout stands in for the scripts/gcp/release.py evidence
  # engine (verified bundle, IAM baselines, smoke identities); that engine
  # replaces these steps once its producers exist (book/src/gcp.md).
  deploy-staging:
    name: Deploy staging
    needs: [scope, result, images]
    # Off unless the repository variable RUST_STAGING_DEPLOY is `enabled`; the
    # GitHub `staging` environment holds the coda-rust-staging WIF provider,
    # deployer service account, project and region (book/src/gcp.md).
    if: needs.scope.outputs.full == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RUST_STAGING_DEPLOY == 'enabled'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 120
    concurrency:
      group: rust-staging-release
      cancel-in-progress: false
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/apps
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Require the successful image proof artifact
        env:
          TESTED_ARTIFACT_ID: ${{ needs.images.outputs.tested-artifact-id }}
        run: test -n "$TESTED_ARTIFACT_ID"
      - name: Download the tested image archives from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.images.outputs.tested-artifact-id }}
          path: tested-images
          merge-multiple: true
      - name: Verify the tested image handoff before authenticating
        run: python3 scripts/staging_images.py verify tested-images --revision "$GITHUB_SHA"
      - name: Authenticate as the staging deployer
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Publish the tested images by digest
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          nix develop .#release --command python scripts/staging_images.py publish \
            tested-images release --revision "$GITHUB_SHA" --registry "$REGISTRY"
          cat release/tested-images.json >> "$GITHUB_STEP_SUMMARY"
      - name: Migrate and roll out physician, then duet
        run: |
          set -euo pipefail
          run() { gcloud --project "$PROJECT" run "$@" --region "$REGION" --quiet; }
          for app in physician duet; do
            migration=$(cat "release/$app-migration")
            runtime=$(cat "release/$app-runtime")
            # The migration runs to completion before the service moves.
            run jobs update "$app-migrate" --image "$migration"
            execution=$(run jobs execute "$app-migrate" --wait --format 'value(metadata.name)')
            echo "$execution" > "release/$app-migration-execution"
            echo "$app-migrate execution $execution succeeded" >> "$GITHUB_STEP_SUMMARY"
            # Waits for the new revision; a revision that never becomes Ready
            # fails this step and keeps traffic on the previous one.
            run services update "$app" --image "$runtime"
            service=$(run services describe "$app" --format json)
            ready=$(jq -r '.status.latestReadyRevisionName' <<<"$service")
            created=$(jq -r '.status.latestCreatedRevisionName' <<<"$service")
            served=$(jq -r '.spec.template.spec.containers[0].image' <<<"$service")
            [ "$ready" = "$created" ] || { echo "::error::$app revision $created is not Ready ($ready is)"; exit 1; }
            [ "$served" = "$runtime" ] || { echo "::error::$app serves $served, expected $runtime"; exit 1; }
            jq -e '[.status.traffic[] | select(.latestRevision == true) | .percent] | add == 100' <<<"$service" >/dev/null \
              || { echo "::error::$app's latest revision does not serve all traffic"; exit 1; }
            echo "$ready" > "release/$app-revision"
            echo "$app revision $ready serves $runtime" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Roll out physician-worker when the service exists
        run: |
          set -euo pipefail
          run() { gcloud --project "$PROJECT" run "$@" --region "$REGION" --quiet; }
          worker=$(cat "release/physician-worker")
          # The scaling plan creates this service from the digest published
          # above. Until then, a missing service is the expected first push.
          if ! run services describe physician-worker --format 'value(metadata.name)' >/dev/null 2>physician-worker-describe.err; then
            if grep -Eq 'Cannot find service|NOT_FOUND' physician-worker-describe.err; then
              echo "physician-worker is not in this project yet. Record \`$worker\` as images.physician.worker, then apply the reviewed scaling plan." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::could not describe physician-worker"
            cat physician-worker-describe.err >&2
            exit 1
          fi
          run services update physician-worker --image "$worker"
          service=$(run services describe physician-worker --format json)
          ready=$(jq -r '.status.latestReadyRevisionName' <<<"$service")
          created=$(jq -r '.status.latestCreatedRevisionName' <<<"$service")
          served=$(jq -r '.spec.template.spec.containers[0].image' <<<"$service")
          [ "$ready" = "$created" ] || { echo "::error::physician-worker revision $created is not Ready ($ready is)"; exit 1; }
          [ "$served" = "$worker" ] || { echo "::error::physician-worker serves $served, expected $worker"; exit 1; }
          jq -e '[.status.traffic[] | select(.latestRevision == true) | .percent] | add == 100' <<<"$service" >/dev/null \
            || { echo "::error::physician-worker's latest revision does not serve all traffic"; exit 1; }
          echo "physician-worker revision $ready serves $worker" >> "$GITHUB_STEP_SUMMARY"
      - name: Save the release receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: ignore

  # ENG-65: the shared collector config (deployed and local overlays) and the
  # OpenTofu roots it rides on. otelcol-contrib and tofu come from the nix
  # shell. Providers download, but no backend initializes and no plan
  # touches a real project: the tests run against mock providers.
  observability:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    name: Collector config and observability OpenTofu
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      # Placeholders only; validate checks the config, never connects.
      LANGFUSE_PUBLIC_KEY: pk-lf-ci
      LANGFUSE_SECRET_KEY: sk-lf-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Validate the collector config
        run: |
          nix develop .#agent --command otelcol-contrib validate --config dev/observability/collector.yaml
          nix develop .#agent --command otelcol-contrib validate --config dev/observability/collector.yaml --config dev/observability/collector.debug.yaml
          nix develop .#agent --command otelcol-contrib validate --config dev/observability/collector.yaml --config dev/observability/collector.datadog.yaml
      - name: Check the local stack
        run: |
          docker compose -f dev/observability/compose.yaml config -q
          bash -n scripts/observability-up.sh
      - name: Validate and test the OpenTofu roots
        run: |
          for root in infra/gcp/observability infra/gcp/physician-runtime; do
            nix develop .#agent --command tofu fmt -check -recursive "$root"
            nix develop .#agent --command tofu -chdir="$root" init -backend=false -input=false
            nix develop .#agent --command tofu -chdir="$root" validate
            nix develop .#agent --command tofu -chdir="$root" test
          done

  # RustSec advisories, license allow-list, bans, and source checks.
  # deny.toml is the single policy file; the nix dev shell carries the same
  # cargo-deny so `nix develop .#agent --command cargo deny check` matches this job.
  cargo-deny:
    needs: [scope, lightweight]
    if: needs.scope.outputs.full == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check dependency guardrails
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `arguments` is word-split into the argv head; `command-arguments`
          # land after `check`. Putting the sections in `arguments` made clap
          # read `advisories` as the subcommand and the job failed.
          arguments: --all-features
          command-arguments: advisories bans licenses sources
