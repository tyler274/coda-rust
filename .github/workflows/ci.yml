name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Saving the Rust build cache needs this. The default token is contents-only.
  actions: write

jobs:
  ci:
    # Blacksmith runner (ENG-76): same image as GitHub's ubuntu-24.04, and
    # actions/cache talks to Blacksmith's colocated cache with no change.
    # Roll back by setting runs-on to ubuntu-latest again.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      # Preinstalled SDKs are unused here and leave no room to archive target
      # beside itself (run 39309157954, ENOSPC during cache save). The build,
      # proofs, and archive peaked at 16 GB plus a 9.6 GB archive reserve
      # (run 39452707783), so 40 GiB free skips the two-minute delete.
      - name: Free runner disk
        run: |
          df -h /
          avail_gib=$(( $(df -B1 --output=avail / | awk 'NR==2 { print $1 }') / 1073741824 ))
          if [ "$avail_gib" -ge 40 ]; then
            echo "${avail_gib} GiB free; skipping SDK removal"
            exit 0
          fi
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Release binaries, not `cargo install`. wasm-bindgen 0.2.129 matches
      # flake `wasm-bindgen-cli_0_2_129`. mdbook 0.4.52 is the pin this job
      # already compiled. The locked nixpkgs mdbook is newer; CI stays on
      # the version the book build already runs.
      - name: Install wasm-bindgen
        run: |
          version=0.2.129
          archive="wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 755 "/tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen" "${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"
          wasm-bindgen --version
      - name: Install mdBook
        run: |
          version=0.4.52
          archive="mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/rust-lang/mdBook/releases/download/v${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          echo "c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          install -m 755 /tmp/mdbook "${CARGO_HOME:-$HOME/.cargo}/bin/mdbook"
          mdbook --version
      - name: Rustc version
        id: rustc
        run: |
          version="$(rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
            rust-v2-${{ runner.os }}-
      - name: Install Chromium
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Check formatting
        run: cargo fmt --check
      # CI parity with the pre-commit hook (.githooks/pre-commit): a commit
      # that slips past --no-verify still faces clippy here. Warnings are
      # reported, not denied, until the tree is clean.
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Test
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        # GitHub has no Node practice on port 8787. That comparison fails
        # closed when it runs; it is not counted as passed here. The Android
        # shell is proved by UI Automator on a local emulator, not by this job.
        run: cargo test --workspace -- --skip the_live_react_practice_matches_the_rust_page
      - name: Browser proof (physician auth journeys)
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo test -p physician-sample --test auth_browser --test site --test react -- --skip the_live_react_practice_matches_the_rust_page
      - name: Browser proof (mode shells)
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo test -p mobile --test mode --test browser --test duet_journey
      # The archive is written beside target, so free space has to hold that
      # second copy. Drop proof outputs, then build-script dirs if it is
      # still tight. Registry is always saved. A target that does not fit
      # is not saved under the primary key, and the job fails.
      - name: Prepare Rust cache payload
        id: cache-payload
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf target/wasm32-unknown-unknown target/debug/incremental target/doc target/debug/examples
          if [ -d target/debug ]; then
            find target/debug -maxdepth 1 -type f -delete
          fi
          sudo rm -rf /opt/hostedtoolcache/setup-chrome || true
          free_bytes() { df -B1 --output=avail / | awk 'NR==2 { print $1 }'; }
          payload_bytes() {
            local bytes=0 path size
            for path in "$HOME/.cargo/registry/index" "$HOME/.cargo/registry/cache" "$HOME/.cargo/git/db" ${1:+target}; do
              if [ -e "$path" ]; then
                size="$(du -sb "$path" | awk '{ print $1 }')"
                bytes=$((bytes + size))
              fi
            done
            echo "$bytes"
          }
          fits() {
            local payload free need
            payload="$(payload_bytes "$1")"
            free="$(free_bytes)"
            # zstd of these artifacts is smaller than the payload. Require
            # two thirds plus 1 GiB so the archive is not written into a full disk.
            need=$((payload * 2 / 3 + 1073741824))
            echo "include_target=${1:-false} payload=${payload} free=${free} need=${need}"
            [ "$free" -ge "$need" ]
          }
          include_target=true
          if ! fits true; then
            rm -rf target/debug/build
            if ! fits true; then
              include_target=false
              rm -rf target
              fits false || true
            fi
          fi
          echo "include_target=${include_target}" >> "$GITHUB_OUTPUT"
          df -h
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save cargo registry without target
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}-registry
      - name: Require the dependency target in the cache
        if: steps.rust-cache.outputs.cache-hit != 'true' && steps.cache-payload.outputs.include_target != 'true'
        run: |
          echo "::error::Compiled target did not fit beside its archive. Registry was saved under a separate key; this run did not cache build artifacts."
          exit 1
      # A full proof target once left no room to compile mdbook (run
      # 38686057176, ENOSPC). mdbook is now a prebuilt binary. After the
      # clean, cargo doc recompiled 215 crates (2.5 min, run 39452707783).
      # With the cache saved, 30 GB was still free at this point on
      # ubuntu-latest. The clean runs only when free space drops under
      # 15 GiB, so docs can reuse the dependency metadata already built.
      - name: Free build artifacts
        run: |
          df -h /
          avail_gib=$(( $(df -B1 --output=avail / | awk 'NR==2 { print $1 }') / 1073741824 ))
          if [ "$avail_gib" -lt 15 ]; then
            echo "${avail_gib} GiB free; cleaning target before docs"
            cargo clean
          else
            echo "${avail_gib} GiB free; keeping target for cargo doc"
          fi
      - name: Check the Doppler installer
        run: bash -n scripts/gcp/install_doppler.sh
      - name: Build the book and the rustdoc
        run: |
          mdbook build book
          cargo doc --no-deps --workspace

  # RustSec advisories, license allow-list, bans, and source checks.
  # deny.toml is the single policy file; the nix dev shell carries the same
  # cargo-deny so `nix develop --command cargo deny check` matches this job.
  cargo-deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check dependency guardrails
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `arguments` is word-split into the argv head; `command-arguments`
          # land after `check`. Putting the sections in `arguments` made clap
          # read `advisories` as the subcommand and the job failed.
          arguments: --all-features
          command-arguments: advisories bans licenses sources
