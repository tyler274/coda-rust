name: Deploy public site and book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site and documentation book
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Rustc version
        id: rustc
        run: |
          version="$(rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ steps.rustc.outputs.version }}-
            rust-v2-${{ runner.os }}-
      - name: Download mdBook
        uses: ./.github/actions/release-archive
        with:
          repo: rust-lang/mdBook
          tag: v0.4.52
          asset: mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz
          sha256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768
      - name: Install mdBook
        run: |
          tar -xzf /tmp/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          install -m 755 /tmp/mdbook "${CARGO_HOME:-$HOME/.cargo}/bin/mdbook"
          mdbook --version
      - name: Download wasm-bindgen
        uses: ./.github/actions/release-archive
        with:
          repo: wasm-bindgen/wasm-bindgen
          tag: 0.2.129
          asset: wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          sha256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
      - name: Install wasm-bindgen
        run: |
          tar -xzf /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -C /tmp
          install -m 755 /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen "${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"
          wasm-bindgen --version
      - name: Download sql.js WASM runtime
        uses: ./.github/actions/release-archive
        with:
          repo: sql-js/sql.js
          tag: v1.16.0
          asset: sqljs-wasm.zip
          sha256: 5ac3671ec7d03a0fb73b92031f576bccd4c591a1a454fca01b125610fc691bd6
      - name: Export public-site, book, and browser SQLite physician demo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          SQLJS_ARCHIVE: /tmp/sqljs-wasm.zip
        run: |
          export BASE_PATH="${BASE_PATH:-/}"
          export ORIGIN="${BASE_URL:-https://coda.dabney.moe}"
          export OUT_DIR="$PWD/_site"
          bash scripts/build-pages-site.sh
      - name: Verify the Pages-only statement and domain boundary
        run: python3 crates/public-site/tests/test_pages_statement.py
      - name: Include the approved personal statement on its designated domain only
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [[ "$BASE_URL" == "https://coda.dabney.moe" || "$BASE_URL" == "http://coda.dabney.moe" ]]; then
            install -D -m 644 crates/public-site/pages-only/personal-clarification/index.html \
              _site/personal-clarification/index.html
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
