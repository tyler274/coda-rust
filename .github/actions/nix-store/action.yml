name: Nix store on a sticky disk
description: >-
  Mount this job's /nix from a Blacksmith sticky disk, then install Nix over it,
  so the job fetches only the store paths its last main run didn't leave behind.
  Pair it with a final `python3 scripts/nix-cache/nix_store.py finish` step that
  runs with always(), after the private cache cleanup.
inputs:
  job:
    description: >-
      The CI job's id. Each job keeps its own disk, nix-<job>, because each job
      needs a different closure.
    required: true
runs:
  using: composite
  steps:
    # Only main runs save the disk: pushes to main, the weekly schedule and
    # manual runs on main. Pull requests and merge-queue candidates load main's
    # disk and discard their changes. A pull request can edit this workflow, so
    # this condition only saves work; Blacksmith's sticky disk branch protection
    # is what keeps untrusted runs from saving a disk that the deploy and
    # publish jobs load.
    - name: Mount the Nix store sticky disk
      uses: useblacksmith/stickydisk@v1
      with:
        key: nix-${{ inputs.job }}
        path: /nix
        commit: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    # Before the install adds its own bootstrap paths: what the disk brought.
    - name: Report the Nix store at start
      shell: bash
      run: python3 scripts/nix-cache/nix_store.py start
    # The installer accepts an existing /nix: it takes root ownership of it,
    # replaces its own bootstrap paths, registers them in the existing
    # database, and adds a default-profile generation.
    - name: Install Nix
      uses: cachix/install-nix-action@v31
