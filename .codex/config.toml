[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.nixos]
command = "uvx"
args = ["mcp-nixos==3.1.0"]

[mcp_servers.slack]
url = "https://mcp.slack.com/mcp"
